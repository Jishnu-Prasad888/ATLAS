[package]
name        = "beacon-agent"
version     = "1.0.0"
edition     = "2021"
description = "Beacon distributed Linux observability agent"

[[bin]]
name = "beacon-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio             = { version = "1",    features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util      = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# Cryptography
aes-gcm = "0.10"
argon2  = "0.5"
sha2    = "0.10"
rand    = "0.8"
base64  = "0.22"
hex     = "0.4"
flate2  = "1"

# TLS
rustls              = "0.22"
rustls-native-certs = "0.7"
webpki-roots        = "0.26"

# Storage
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# HTTP (REST fallback)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# System metrics
sysinfo = "0.30"

# CLI & Config
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
dirs = "5"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid        = { version = "1",   features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
anyhow      = "1"
thiserror   = "1"
async-trait = "0.1"
once_cell   = "1"
regex       = "1"
url         = "2"

# TUI
ratatui   = "0.26"
crossterm = "0.27"

[dev-dependencies]
# Async test runtime
tokio = { version = "1", features = ["full", "test-util"] }
# JSON assertions
serde_json = "1"
# Temporary directories for storage tests
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[profile.test]
# Faster test builds — no LTO, some optimisation for proc parsing
opt-level = 1
