services:
  nats:
    image: nats:2.10
    restart: unless-stopped
    command:
      - "-js"
      - "-sd"
      - "/data/jetstream"
      - "-p"
      - "4222"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - natsdata:/data/jetstream
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       beacon
      POSTGRES_USER:     beacon
      POSTGRES_PASSWORD: beacon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  natsdata:
  pgdata:
  redisdata:
