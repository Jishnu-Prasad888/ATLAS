version: "3.9"

services:
  nats:
    image: nats:2.10
    restart: unless-stopped
    command:
      - "-js"
      - "-DV"
      - "-DVV"
      - "-sd"
      - "/data/jetstream"
      - "-p"
      - "4222"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    volumes:
      - natsdata:/data/jetstream

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    command: >-
      /bin/sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 beacon_server.asgi:application"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: beacon_server.settings
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      BEACON_NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./logs:/app/logs
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media

  sandbox:
    build:
      context: ./sandbox
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - ./sandbox:/workspace
    depends_on:
      nats:
        condition: service_started

volumes:
  natsdata:
  pgdata:
  redisdata:
